<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <title>Aviatheme</title>
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
</head>
<body>

<header class="header">
  <div class="logo">✈ Aviatheme</div>

  <div class="nav-buttons">
    <button class="icon-btn" onclick="openCalc()">
      <i class="fas fa-calculator"></i>
    </button>

    <a href="https://github.com/" target="_blank" class="icon-btn">
      <i class="fab fa-github"></i>
    </a>
  </div>
</header>

<section class="hero">
  <h1>Тут покупают дешёвые авиабилеты</h1>

  <div class="search-box">
    <input type="text" placeholder="Откуда">
    <input type="text" placeholder="Куда">

    <select>
      <option>1 пассажир</option>
      <option>2 пассажира</option>
      <option>3 пассажира</option>
    </select>

    <button class="btn-orange">Найти</button>
  </div>
</section>

<!-- Details -->
<section class="info">
  <details>
    <summary>Автор</summary>
    <p>ФИО: Девятов Илья</p>
    <p>Группа: ИУ5-42Б</p>
  </details>

  <p class="goal">
    Цель ЛР: <mark>знакомство</mark> с <mark>HTML</mark> и <mark>CSS</mark>
  </p>
</section>

<script src="script.js"></script>
</body>
</html>
